<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center">Bienvenido {{usuario.nombre}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>
  <div class="map-container">
    <div id="map"></div>

    <!-- Formulario que aparece encima del mapa -->
    <ion-card *ngIf="mostrarFormulario"
              class="formulario-reporte"
              [class.slide-in-animation]="!animatingOut"
              [class.slide-out-animation]="animatingOut">
      <ion-button class="boton-cerrar" fill="clear" (click)="toggleFormulario()">
        <ion-icon slot="icon-only" name="close-outline" color="medium"></ion-icon>
      </ion-button>
      <ion-card-header>
        <ion-card-title>Detalles del Reporte</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <form [formGroup]="reporteForm" (ngSubmit)="onSubmit()">
          
          <!-- 🔧 AGREGAR iconos a los campos -->
          <ion-item>
            <ion-icon name="alert-circle-outline" class="form-icon"></ion-icon>
            <div class="label-with-circle">
              <ion-label position="stacked">Tipo de Incidente</ion-label>
              <div class="color-circle" [ngStyle]="{ 'background-color': colorSeleccionado }"></div>
            </div>
            <ion-select
              formControlName="tipo"
              placeholder="Selecciona el tipo de incidente"
              interface="popover"
              (ionChange)="actualizarColor($event.detail.value)"
            >
              <ion-select-option value="robo">🚨 Robo</ion-select-option>
              <ion-select-option value="accidente">🚗 Accidente</ion-select-option>
              <ion-select-option value="incendio">🔥 Incendio</ion-select-option>
              <ion-select-option value="violencia">⚠️ Violencia</ion-select-option>
              <ion-select-option value="otro">❓ Otro</ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item>
            <ion-icon name="create-outline" class="form-icon"></ion-icon>
            <ion-label position="stacked">Descripción del Incidente</ion-label>
            <ion-textarea formControlName="descripcion" placeholder="Escribe tu comentario aquí..." rows="4"></ion-textarea>
          </ion-item>
          
          <ion-item>
            <ion-icon name="location-outline" class="form-icon"></ion-icon>
            <ion-label position="stacked">Ubicación del Incidente</ion-label>
            <ion-input formControlName="ubicacion" placeholder="Obteniendo ubicación..." type="text" readonly></ion-input>
          </ion-item>
          
          <ion-button expand="full" type="submit" class="btnReporte">
            <ion-icon name="send-outline" slot="start"></ion-icon>
            Enviar Reporte
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>

  </div>
  
  <!-- Botón flotante fijo -->
  <div class="floating-button">
    <ion-button expand="block" class="boton" (click)="toggleFormulario()">Reportar</ion-button>
  </div>

</ion-content>
