<ion-content [@routeAnimations]="prepareRoute(outlet)">
  <router-outlet #outlet="outlet"></router-outlet>
</ion-content>

<ion-footer>
  <ion-tab-bar slot="bottom">
    <ion-tab-button
      tab="home"
      routerLink="/home"
      [ngClass]="{'tab-selected': router.url === '/home'}">
      <ion-icon name="home-outline"></ion-icon>
      <ion-label></ion-label>
    </ion-tab-button>
    <ion-tab-button
      tab="comentario"
      routerLink="/comentario"
      [ngClass]="{'tab-selected': router.url === '/comentario'}">
      <ion-icon name="chatbox-ellipses-outline"></ion-icon>
      <ion-label></ion-label>
    </ion-tab-button>
    <ion-tab-button
      tab="perfil"
      routerLink="/perfil"
      [ngClass]="{'tab-selected': router.url === '/perfil'}">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label></ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
